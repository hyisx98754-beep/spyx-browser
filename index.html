<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    #topbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #020617;
      align-items: center;
    }

    #url {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      font-weight: bold;
    }

    #createBtn {
      position: absolute;
      right: 10px;
      top: 55px;
      background: #3b82f6;
      color: white;
    }

    #home {
      text-align: center;
      padding: 40px;
    }

    #viewer {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      display: none;
      background: white;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .link {
      cursor: pointer;
      color: #38bdf8;
    }
  </style>
</head>

<body>

<div id="topbar">
  <input id="url" placeholder="Search / URL / .spy">

  <button onclick="go()">Go</button>
  <button onclick="openWiki()">Wikipedia</button>
  <button onclick="openDirect()">URL</button>
  <button onclick="openManager()">My .spy</button>
  <button onclick="openPublic()">Public .spy</button>
</div>

<button id="createBtn" onclick="openCreate()">Create .spy</button>

<div id="home">
  <div class="logo">SpyX Browser</div>
  <p>Hybrid proxy browser system</p>
</div>

<iframe id="viewer"></iframe>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBjUx7G7Llqx6OGLcwRdixqyOBcXtN6f7A",
  authDomain: "spyx-browser.firebaseapp.com",
  projectId: "spyx-browser"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* PROXY */
const NODE_PROXY = "https://spyx-browser.onrender.com/proxy?url=";

/* UI */
function showBrowser() {
  document.getElementById("home").style.display = "none";
  document.getElementById("viewer").style.display = "block";
}

/* NAV */
window.go = function () {
  let input = document.getElementById("url").value.trim();
  if (!input) return;

  showBrowser();

  if (input.endsWith(".spy")) {
    loadSpy(input);
    return;
  }

  if (input.includes(".")) {
    openDirect();
    return;
  }

  openWiki();
};

/* URL */
window.openDirect = function () {
  let url = document.getElementById("url").value.trim();

  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  document.getElementById("viewer").src =
    NODE_PROXY + encodeURIComponent(url);
};

/* WIKI */
window.openWiki = function () {
  let q = document.getElementById("url").value.trim();

  const url =
    "https://en.wikipedia.org/wiki/Special:Search?search=" +
    encodeURIComponent(q);

  document.getElementById("viewer").src =
    NODE_PROXY + encodeURIComponent(url);
};

/* LOAD .spy */
async function loadSpy(name) {
  const snap = await getDocs(collection(db, "sites"));

  snap.forEach(d => {
    let data = d.data();

    if (data.nombre === name) {
      let html = atob(data.contenido);

      document.getElementById("viewer").srcdoc = `
        <html>
        <body style="font-family:Arial;padding:20px;">
          ${html}
        </body>
        </html>
      `;
    }
  });
}

/* MANAGER */
window.openManager = async function () {
  showBrowser();

  const snap = await getDocs(collection(db, "sites"));

  let html = "<h2>My .spy sites</h2>";

  snap.forEach(d => {
    let data = d.data();

    html += `
      <p class="link" onclick="parent.openSpy('${data.nombre}')">
        ${data.nombre}
      </p>
      <button onclick="parent.deleteSpy('${d.id}')">Delete</button>
      <hr>
    `;
  });

  document.getElementById("viewer").srcdoc = html;
};

window.openSpy = function(name) {
  document.getElementById("url").value = name;
  loadSpy(name);
};

/* DELETE */
window.deleteSpy = async function(id) {
  await deleteDoc(doc(db, "sites", id));
  alert("Deleted");
  openManager();
};

/* CREATE */
window.openCreate = async function () {
  showBrowser();

  const snap = await getDocs(collection(db, "sites"));

  if (snap.size >= 2) {
    alert("Max 2 .spy sites allowed");
    return;
  }

  document.getElementById("viewer").srcdoc = `
    <html>
    <body style="font-family:Arial;background:#0f172a;color:white;padding:20px;">
      <h2>Create .spy</h2>

      <input id="name" placeholder="name.spy"><br><br>

      <textarea id="content"></textarea><br><br>

      <label>
        <input type="checkbox" id="public"> Public
      </label><br><br>

      <button onclick="parent.saveSpy()">Save</button>
    </body>
    </html>
  `;
};

/* SAVE */
window.saveSpy = async function () {
  let docu = document.getElementById("viewer").contentWindow.document;

  let name = docu.getElementById("name").value;
  let content = docu.getElementById("content").value;
  let isPublic = docu.getElementById("public").checked;

  if (!name.endsWith(".spy")) {
    alert("Must end in .spy");
    return;
  }

  await addDoc(collection(db, "sites"), {
    nombre: name,
    contenido: btoa(content),
    public: isPublic,
    likes: 0
  });

  alert("Saved");
  openManager();
};

/* PUBLIC LIST */
window.openPublic = async function () {
  showBrowser();

  const snap = await getDocs(collection(db, "sites"));

  let sites = [];

  snap.forEach(d => {
    let data = d.data();
    if (data.public) {
      sites.push({ id: d.id, ...data });
    }
  });

  sites.sort((a, b) => b.likes - a.likes);

  let html = "<h2>🌍 Public .spy</h2>";

  sites.forEach(s => {
    html += `
      <div style="margin-bottom:15px;">
        <p class="link" onclick="parent.openSpy('${s.nombre}')">
          ${s.nombre}
        </p>

        ❤️ ${s.likes}

        <button onclick="parent.likeSpy('${s.id}')">
          Like
        </button>
      </div>
    `;
  });

  document.getElementById("viewer").srcdoc = html;
};

/* LIKE */
window.likeSpy = async function(id) {
  const ref = doc(db, "sites", id);

  const snap = await getDocs(collection(db, "sites"));

  snap.forEach(d => {
    if (d.id === id) {
      let data = d.data();
      updateDoc(ref, {
        likes: (data.likes || 0) + 1
      });
    }
  });

  openPublic();
};

</script>

</body>
</html>
