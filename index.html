<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    #topbar {
      display: flex;
      padding: 10px;
      background: #020617;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      color: black;
    }

    #viewer {
      padding: 20px;
      min-height: 90vh;
      background: #111827; /* 🔥 YA NO BLANCO */
      color: white;
    }

    textarea {
      width: 100%;
      height: 200px;
    }

    .link {
      cursor: pointer;
      color: #38bdf8;
    }
  </style>
</head>

<body>

<div id="topbar">
  <input id="url" placeholder="Buscar o escribir (.spy)">
  <button onclick="go()">Ir</button>
</div>

<div id="viewer">
  <h1>🕵️ SpyX Browser</h1>
  <p>Explorador privado experimental</p>

  <button onclick="abrirCrear()">Create my own .spy site</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjUx7G7Llqx6OGLcwRdixqyOBcXtN6f7A",
  authDomain: "spyx-browser.firebaseapp.com",
  projectId: "spyx-browser",
  storageBucket: "spyx-browser.firebasestorage.app",
  messagingSenderId: "496774958625",
  appId: "1:496774958625:web:74284624e8a4c405071d60"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const viewer = document.getElementById("viewer");

/* 🔍 BUSCAR */
window.go = function() {
  let url = document.getElementById("url").value.trim();

  if (!url) return;

  // .spy interno
  if (url.endsWith(".spy")) {
    cargarSpy(url);
    return;
  }

  // 🔥 BUSQUEDA REAL (abre en nueva pestaña)
  window.open("https://duckduckgo.com/?q=" + encodeURIComponent(url), "_blank");
};

/* 🕵️ CARGAR .spy */
async function cargarSpy(nombre) {
  const snap = await getDocs(collection(db, "sites"));

  let encontrado = false;

  snap.forEach(docu => {
    const data = docu.data();

    if (data.nombre === nombre) {
      viewer.innerHTML = `
        <h2>${data.nombre}</h2>

        <textarea id="edit">${data.contenido}</textarea><br><br>

        <button onclick="guardar('${docu.id}')">Guardar</button>
        <button onclick="borrar('${docu.id}')">Eliminar</button>
        <button onclick="abrirCrear()">Volver</button>
      `;
      encontrado = true;
    }
  });

  if (!encontrado) {
    viewer.innerHTML = `<h2>No existe este sitio .spy</h2>
    <button onclick="abrirCrear()">Crear uno</button>`;
  }
}

/* ➕ ABRIR CREAR */
window.abrirCrear = function() {
  viewer.innerHTML = `
    <h2>Crear sitio .spy</h2>

    <input id="name" placeholder="nombre.spy"><br><br>
    <textarea id="content" placeholder="Contenido"></textarea><br><br>

    <button onclick="crear()">Crear</button>
    <button onclick="listar()">Ver sitios</button>
  `;
};

/* 💾 CREAR */
window.crear = async function() {
  const nombre = document.getElementById("name").value;
  const contenido = document.getElementById("content").value;

  if (!nombre || !contenido) {
    alert("Completa todo");
    return;
  }

  if (!nombre.endsWith(".spy")) {
    alert("Debe terminar en .spy");
    return;
  }

  await addDoc(collection(db, "sites"), {
    nombre,
    contenido
  });

  alert("Sitio creado");
};

/* 📂 LISTAR */
window.listar = async function() {
  const snap = await getDocs(collection(db, "sites"));

  let html = "<h2>Sites</h2>";

  snap.forEach(docu => {
    const d = docu.data();
    html += `<p class="link" onclick="abrir('${d.nombre}')">${d.nombre}</p>`;
  });

  viewer.innerHTML = html;
};

window.abrir = function(nombre) {
  document.getElementById("url").value = nombre;
  cargarSpy(nombre);
};

/* ✏️ GUARDAR */
window.guardar = async function(id) {
  const texto = document.getElementById("edit").value;

  await updateDoc(doc(db, "sites", id), {
    contenido: texto
  });

  alert("Guardado");
};

/* ❌ BORRAR */
window.borrar = async function(id) {
  await deleteDoc(doc(db, "sites", id));
  alert("Eliminado");
  abrirCrear();
};

</script>

</body>
</html>
