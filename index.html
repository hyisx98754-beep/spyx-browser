<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    #topbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #020617;
      align-items: center;
    }

    #url {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      font-weight: bold;
    }

    #createBtn {
      position: absolute;
      right: 10px;
      top: 55px;
      background: #3b82f6;
      color: white;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #viewer {
      flex: 1;
      border: none;
      background: white;
      display: none;
    }

    #home {
      padding: 40px;
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div id="topbar">
  <input id="url" placeholder="Search or enter .spy or URL">
  <button onclick="go()">Go</button>
</div>

<button id="createBtn" onclick="openCreate()">Create .spy</button>

<div id="home">
  <h1>🕵️ SpyX Browser</h1>
  <p>Secure experimental browser system</p>

  <button onclick="openCreate()">Create my own .spy site</button>
</div>

<iframe id="viewer"></iframe>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBjUx7G7Llqx6OGLcwRdixqyOBcXtN6f7A",
  authDomain: "spyx-browser.firebaseapp.com",
  projectId: "spyx-browser",
  storageBucket: "spyx-browser.firebasestorage.app",
  messagingSenderId: "496774958625",
  appId: "1:496774958625:web:74284624e8a4c405071d60"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* PROXY */
const NODE_PROXY = "https://spyx-browser.onrender.com/proxy?url=";

/* VIEW */
function showBrowser() {
  document.getElementById("viewer").style.display = "block";
  document.getElementById("home").style.display = "none";
}

/* NAVIGATION */
window.go = function () {
  let url = document.getElementById("url").value.trim();
  if (!url) return;

  showBrowser();

  if (url === "createspyweb.spy") {
    openCreate();
    return;
  }

  if (url.endsWith(".spy")) {
    loadSpy(url);
    return;
  }

  document.getElementById("viewer").src =
    NODE_PROXY + encodeURIComponent(url);
};

/* LOAD SPY */
async function loadSpy(name) {
  const snap = await getDocs(collection(db, "sites"));

  snap.forEach(d => {
    let data = d.data();

    if (data.nombre === name) {
      let content = atob(data.contenido);

      document.getElementById("viewer").srcdoc = `
        <html>
        <body style="font-family:Arial;padding:20px;">
          ${content}
        </body>
        </html>
      `;
    }
  });
}

/* CREATE PAGE */
window.openCreate = function () {
  showBrowser();

  document.getElementById("viewer").srcdoc = `
    <html>
    <body style="font-family:Arial;background:#0f172a;color:white;padding:20px;">
      <h2>🕵️ Create .spy site</h2>

      <input id="name" placeholder="name.spy" style="width:100%;padding:10px;"><br><br>
      <textarea id="content" style="width:100%;height:200px;"></textarea><br><br>

      <button onclick="parent.saveSpy()">Save</button>
    </body>
    </html>
  `;
};

/* SAVE SPY */
window.saveSpy = async function () {
  let doc = document.getElementById("viewer").contentWindow.document;

  let name = doc.getElementById("name").value;
  let content = doc.getElementById("content").value;

  if (!name.endsWith(".spy")) {
    alert("Must end in .spy");
    return;
  }

  await addDoc(collection(db, "sites"), {
    nombre: name,
    contenido: btoa(content)
  });

  alert("Saved .spy site");
};

</script>

</body>
</html>
