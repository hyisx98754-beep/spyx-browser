<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SpyX Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.topbar {
  display:flex;
  gap:5px;
  padding:10px;
  background:#020617;
}

input {
  flex:1;
  padding:10px;
  border:none;
  outline:none;
}

button {
  padding:10px;
  background:#22c55e;
  border:none;
  cursor:pointer;
}

#visor {
  padding:20px;
}

textarea {
  width:100%;
  height:150px;
  margin-top:10px;
}

.spyItem {
  border:1px solid #333;
  padding:10px;
  margin:10px 0;
}
</style>
</head>

<body>

<div class="topbar">
  <input id="url" placeholder="Escribe URL o spy://...">
  <button onclick="abrir()">Abrir</button>
  <button onclick="irCrear()">Create my own .spy site</button>
</div>

<div id="visor">
  <h2>🕵️ SpyX Browser</h2>
  <p>Bienvenido</p>
</div>

<script>

/* 🔹 IR A CREAR */
function irCrear() {
  document.getElementById("url").value = "createspyweb.spy";
  abrir();
}

/* 🔓 ABRIR */
function abrir() {
  let url = document.getElementById("url").value;

  if (!url) return;

  // 🔥 PANEL DE CREACIÓN
  if (url === "createspyweb.spy") {
    mostrarPanel();
    return;
  }

  // 🌐 SITIO SPY
  if (url.startsWith("spy://")) {
    const id = url.replace("spy://", "");
    const contenido = localStorage.getItem("spy_site_" + id);

    if (!contenido) {
      document.getElementById("visor").innerHTML = "❌ Sitio no encontrado";
      return;
    }

    document.getElementById("visor").innerHTML = contenido;
    return;
  }

  // 🌍 WEB NORMAL
  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  window.open(url, "_blank");
}

/* 🧠 MOSTRAR PANEL */
function mostrarPanel() {
  let html = `
    <h2>🛠 Crear sitios .spy</h2>
    <input id="nombreSpy" placeholder="Nombre del sitio"><br>
    <textarea id="contenidoSpy" placeholder="HTML del sitio"></textarea><br>
    <button onclick="guardarSpy()">Guardar</button>
    <hr>
    <h3>📂 Tus sitios</h3>
    <div id="lista"></div>
  `;

  document.getElementById("visor").innerHTML = html;

  cargarLista();
}

/* 💾 GUARDAR */
function guardarSpy() {
  const nombre = document.getElementById("nombreSpy").value;
  const contenido = document.getElementById("contenidoSpy").value;

  if (!nombre) return alert("Pon nombre");

  localStorage.setItem("spy_site_" + nombre, contenido);

  alert("✅ Guardado: spy://" + nombre);

  cargarLista();
}

/* 📂 CARGAR LISTA */
function cargarLista() {
  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);

    if (key.startsWith("spy_site_")) {
      const nombre = key.replace("spy_site_", "");
      const contenido = localStorage.getItem(key);

      lista.innerHTML += `
        <div class="spyItem">
          <b>spy://${nombre}</b><br>
          <button onclick="abrirSpy('${nombre}')">Abrir</button>
          <button onclick="editarSpy('${nombre}')">Editar</button>
          <button onclick="eliminarSpy('${nombre}')">Eliminar</button>
        </div>
      `;
    }
  }
}

/* 🔓 ABRIR DESDE LISTA */
function abrirSpy(nombre) {
  document.getElementById("url").value = "spy://" + nombre;
  abrir();
}

/* ✏️ EDITAR */
function editarSpy(nombre) {
  const contenido = localStorage.getItem("spy_site_" + nombre);

  document.getElementById("nombreSpy").value = nombre;
  document.getElementById("contenidoSpy").value = contenido;
}

/* 🗑 ELIMINAR */
function eliminarSpy(nombre) {
  if (!confirm("¿Eliminar spy://" + nombre + "?")) return;

  localStorage.removeItem("spy_site_" + nombre);

  cargarLista();
}

</script>

</body>
</html>
