<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    #topbar {
      display: none;
      padding: 10px;
      background: #020617;
      gap: 8px;
    }

    #urlBar {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      font-weight: bold;
    }

    #home {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .searchBox {
      width: 90%;
      max-width: 500px;
      display: flex;
      gap: 10px;
    }

    .searchBox input {
      flex: 1;
      padding: 14px;
      border-radius: 30px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    #viewer {
      width: 100%;
      height: 100vh;
      border: none;
      display: none;
      background: white;
    }

    .shortcut {
      margin-top: 30px;
      padding: 15px 25px;
      border-radius: 15px;
      background: #1e293b;
      cursor: pointer;
    }

    .saveBtn {
      margin-top: 10px;
      background: #3b82f6;
    }
  </style>
</head>

<body>

<!-- TOP BAR -->
<div id="topbar">
  <input id="urlBar">
  <button onclick="go()">Go</button>
</div>

<!-- HOME -->
<div id="home">
  <div class="logo">SpyX</div>

  <div class="searchBox">
    <input id="search" placeholder="Search or type URL">
  </div>

  <div class="actions">
    <button onclick="searchAuto()">Search</button>
    <button onclick="searchURL()">URL</button>
    <button onclick="searchWiki()">Wikipedia</button>
  </div>

  <div id="shortcutContainer"></div>
</div>

<iframe id="viewer"></iframe>

<script>
const NODE_PROXY = "https://spyx-browser.onrender.com/proxy?url=";

/* UI SWITCH */
function openBrowser() {
  document.getElementById("home").style.display = "none";
  document.getElementById("topbar").style.display = "flex";
  document.getElementById("viewer").style.display = "block";
}

/* SEARCH MODES */
function searchAuto() {
  let input = document.getElementById("search").value.trim();
  if (!input) return;

  if (input.includes(".")) {
    loadURL(input);
  } else {
    loadWiki(input);
  }
}

function searchURL() {
  let input = document.getElementById("search").value.trim();
  if (!input) return;
  loadURL(input);
}

function searchWiki() {
  let input = document.getElementById("search").value.trim();
  if (!input) return;
  loadWiki(input);
}

/* LOADERS */
function loadURL(url) {
  openBrowser();

  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  document.getElementById("urlBar").value = url;

  document.getElementById("viewer").src =
    NODE_PROXY + encodeURIComponent(url);
}

function loadWiki(q) {
  openBrowser();

  let url =
    "https://en.wikipedia.org/wiki/Special:Search?search=" +
    encodeURIComponent(q);

  document.getElementById("urlBar").value = q;

  document.getElementById("viewer").src =
    NODE_PROXY + encodeURIComponent(url);
}

/* GO FROM TOPBAR */
function go() {
  let input = document.getElementById("urlBar").value.trim();
  if (!input) return;

  if (input.includes(".")) {
    loadURL(input);
  } else {
    loadWiki(input);
  }
}

/* ⭐ SHORTCUT (1 SLOT) */
function saveShortcut() {
  let current = document.getElementById("urlBar").value;
  if (!current) return;

  localStorage.setItem("shortcut", current);
  loadShortcut();
}

function loadShortcut() {
  let s = localStorage.getItem("shortcut");

  let container = document.getElementById("shortcutContainer");

  if (!s) {
    container.innerHTML = "";
    return;
  }

  container.innerHTML = `
    <div class="shortcut" onclick="loadURL('${s}')">
      ⭐ ${s}
    </div>
    <button class="saveBtn" onclick="clearShortcut()">Remove</button>
  `;
}

function clearShortcut() {
  localStorage.removeItem("shortcut");
  loadShortcut();
}

/* AUTO LOAD */
loadShortcut();

/* SAVE BUTTON IN TOPBAR */
const saveBtn = document.createElement("button");
saveBtn.innerText = "⭐";
saveBtn.onclick = saveShortcut;
document.getElementById("topbar").appendChild(saveBtn);
</script>

</body>
</html>
