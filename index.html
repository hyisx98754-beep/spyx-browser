<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    #topbar {
      display: flex;
      background: #020617;
      padding: 10px;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #viewer {
      height: 90vh;
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #home {
      text-align: center;
      margin-top: 100px;
    }

    .spy-btn {
      background: #22c55e;
      color: black;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div id="topbar">
  <input id="url" placeholder="Buscar o escribir URL (.spy)">
  <button onclick="go()">Ir</button>
</div>

<div id="viewer">
  <div id="home">
    <h1>🕵️ SpyX Browser</h1>
    <p>Navegador privado experimental</p>

    <button class="spy-btn" onclick="goCreate()">
      Create my own .spy site
    </button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjUx7G7Llqx6OGLcwRdixqyOBcXtN6f7A",
  authDomain: "spyx-browser.firebaseapp.com",
  projectId: "spyx-browser",
  storageBucket: "spyx-browser.firebasestorage.app",
  messagingSenderId: "496774958625",
  appId: "1:496774958625:web:74284624e8a4c405071d60"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const viewer = document.getElementById("viewer");

/* 🔎 NAVEGAR */
window.go = async function() {
  let url = document.getElementById("url").value.trim();

  if (url === "") return;

  // .spy interno
  if (url.endsWith(".spy")) {
    loadSpy(url);
    return;
  }

  // normal → búsqueda segura
  const search = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
  openIframe(search);
};

/* 🌐 iframe */
function openIframe(link) {
  viewer.innerHTML = `<iframe src="${link}"></iframe>`;
}

/* 🕵️ CARGAR .spy */
async function loadSpy(name) {
  const snap = await getDocs(collection(db, "sites"));

  let found = false;

  snap.forEach(docu => {
    const data = docu.data();

    if (data.nombre === name) {
      viewer.innerHTML = `
        <div style="padding:20px;">
          <h2>${data.nombre}</h2>
          <textarea id="edit" style="width:100%;height:200px;">${data.contenido}</textarea>
          <br><br>
          <button onclick="save('${docu.id}')">Guardar</button>
          <button onclick="remove('${docu.id}')">Eliminar</button>
        </div>
      `;
      found = true;
    }
  });

  if (!found) {
    viewer.innerHTML = `<h2 style="padding:20px;">No existe este .spy</h2>`;
  }
}

/* ➕ CREAR */
window.goCreate = function() {
  document.getElementById("url").value = "createspyweb.spy";
  loadCreate();
};

function loadCreate() {
  viewer.innerHTML = `
    <div style="padding:20px;">
      <h2>Crear sitio .spy</h2>

      <input id="name" placeholder="nombre.spy"><br><br>

      <textarea id="content" placeholder="Contenido"></textarea><br><br>

      <button onclick="create()">Crear</button>
      <button onclick="list()">Ver todos</button>
    </div>
  `;
}

/* 💾 CREAR */
window.create = async function() {
  const nombre = document.getElementById("name").value;
  const contenido = document.getElementById("content").value;

  if (!nombre.endsWith(".spy")) {
    alert("Debe terminar en .spy");
    return;
  }

  await addDoc(collection(db, "sites"), {
    nombre,
    contenido
  });

  alert("Creado");
};

/* 📂 LISTAR */
window.list = async function() {
  const snap = await getDocs(collection(db, "sites"));

  let html = "<h2>Sites</h2>";

  snap.forEach(docu => {
    const d = docu.data();
    html += `<p onclick="openSpy('${d.nombre}')">${d.nombre}</p>`;
  });

  viewer.innerHTML = html;
};

window.openSpy = function(name) {
  document.getElementById("url").value = name;
  loadSpy(name);
};

/* ✏️ EDITAR */
window.save = async function(id) {
  const texto = document.getElementById("edit").value;

  await updateDoc(doc(db, "sites", id), {
    contenido: texto
  });

  alert("Guardado");
};

/* ❌ BORRAR */
window.remove = async function(id) {
  await deleteDoc(doc(db, "sites", id));
  alert("Eliminado");
  goCreate();
};

</script>

</body>
</html>
