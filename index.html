<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
    }

    /* 🔝 Barra superior */
    #topbar {
      display: flex;
      background: #1a1a1a;
      padding: 10px;
      align-items: center;
      gap: 5px;
    }

    #url {
      flex: 1;
      padding: 8px;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    button {
      padding: 8px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background: #333;
      color: white;
    }

    button:hover {
      background: #555;
    }

    /* 🗂️ pestañas */
    #tabs {
      display: flex;
      background: #000;
      padding: 5px;
      overflow-x: auto;
    }

    .tab {
      padding: 5px 10px;
      background: #222;
      margin-right: 5px;
      border-radius: 5px;
      cursor: pointer;
    }

    .active {
      background: #00aa88;
    }

    /* 🌐 contenido */
    iframe {
      width: 100%;
      height: calc(100vh - 90px);
      border: none;
    }
  </style>
</head>

<body>

<!-- 🗂️ pestañas -->
<div id="tabs"></div>

<!-- 🔝 barra -->
<div id="topbar">
  <button onclick="volver()">⬅️</button>
  <button onclick="adelante()">➡️</button>
  <button onclick="recargar()">🔄</button>

  <input id="url" placeholder="Buscar o escribir URL">

  <button onclick="ir()">Ir</button>
  <button onclick="nuevaTab()">➕</button>
</div>

<!-- 🌐 visor -->
<iframe id="visor"></iframe>

<script>

let pestañas = [];
let actual = 0;

/* 🔥 crear nueva pestaña */
function nuevaTab() {
  pestañas.push("https://duckduckgo.com");
  actual = pestañas.length - 1;
  renderTabs();
  cargar();
}

/* 🎯 render pestañas */
function renderTabs() {
  const cont = document.getElementById("tabs");
  cont.innerHTML = "";

  pestañas.forEach((url, i) => {
    const tab = document.createElement("div");
    tab.className = "tab " + (i === actual ? "active" : "");
    tab.innerText = "Tab " + (i + 1);

    tab.onclick = () => {
      actual = i;
      cargar();
      renderTabs();
    };

    cont.appendChild(tab);
  });
}

/* 🌐 cargar página */
function cargar() {
  document.getElementById("visor").src = pestañas[actual];
  document.getElementById("url").value = pestañas[actual];
}

/* 🔍 ir a URL */
function ir() {
  let input = document.getElementById("url").value;

  if (!input.startsWith("http")) {
    input = "https://duckduckgo.com/?q=" + encodeURIComponent(input);
  }

  pestañas[actual] = input;

  // ⚠️ muchos sitios bloquean iframe
  // fallback: abrir en pestaña real
  try {
    document.getElementById("visor").src = input;
  } catch {
    window.open(input, "_blank");
  }
}

/* navegación */
function volver() {
  document.getElementById("visor").contentWindow.history.back();
}

function adelante() {
  document.getElementById("visor").contentWindow.history.forward();
}

function recargar() {
  document.getElementById("visor").contentWindow.location.reload();
}

/* iniciar */
nuevaTab();

</script>

</body>
</html>
