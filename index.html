<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: #020617;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      color: black;
    }

    #createBtn {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #38bdf8;
    }

    #viewer {
      padding: 20px;
      min-height: 90vh;
      background: #111827;
    }

    textarea {
      width: 100%;
      height: 200px;
    }

    .link {
      color: #38bdf8;
      cursor: pointer;
      margin: 5px 0;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .center {
      text-align: center;
      margin-top: 100px;
    }
  </style>
</head>

<body>

<button id="createBtn" onclick="abrirCrear()">Create .spy</button>

<div id="topbar">
  <input id="url" placeholder="Buscar o escribir (.spy o URL)">
  <button onclick="go()">Ir</button>
  <button onclick="inicio()">Inicio</button>
</div>

<div id="viewer"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBjUx7G7Llqx6OGLcwRdixqyOBcXtN6f7A",
  authDomain: "spyx-browser.firebaseapp.com",
  projectId: "spyx-browser",
  storageBucket: "spyx-browser.firebasestorage.app",
  messagingSenderId: "496774958625",
  appId: "1:496774958625:web:74284624e8a4c405071d60"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const viewer = document.getElementById("viewer");

/* =========================
   🔐 CIFRADO REAL
========================= */

async function generarClave(password) {
  const enc = new TextEncoder();

  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    enc.encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );

  return crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: enc.encode("spyx"),
      iterations: 100000,
      hash: "SHA-256"
    },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encriptar(texto, pass) {
  const key = await generarClave(pass);
  const iv = crypto.getRandomValues(new Uint8Array(12));

  const cifrado = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv },
    key,
    new TextEncoder().encode(texto)
  );

  return {
    iv: Array.from(iv),
    data: Array.from(new Uint8Array(cifrado))
  };
}

async function desencriptar(obj, pass) {
  const key = await generarClave(pass);

  const desc = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: new Uint8Array(obj.iv) },
    key,
    new Uint8Array(obj.data)
  );

  return new TextDecoder().decode(desc);
}

/* =========================
   🏠 INICIO
========================= */

window.inicio = function() {
  viewer.innerHTML = `
    <div class="center">
      <h1>SpyX Browser</h1>
      <p>Explorador privado experimental</p>

      <div class="card">
        <b>Funciones:</b><br>
        ✔ Buscador interno<br>
        ✔ Sitios .spy<br>
        ✔ Cifrado real<br>
      </div>

      <button onclick="listar()">Explorar sitios .spy</button>
    </div>
  `;
};

inicio();

/* =========================
   🔎 BUSQUEDA
========================= */

window.go = function() {
  let q = document.getElementById("url").value.trim();
  if (!q) return;

  guardarHistorial(q);

  if (q.endsWith(".spy")) {
    cargarSpy(q);
  } else {
    buscar(q);
  }
};

async function buscar(q) {
  const snap = await getDocs(collection(db, "sites"));

  let resultados = [];

  snap.forEach(docu => {
    const d = docu.data();
    if (
      d.nombre.toLowerCase().includes(q.toLowerCase()) ||
      d.contenido.toLowerCase().includes(q.toLowerCase())
    ) {
      resultados.push(d.nombre);
    }
  });

  if (resultados.length === 0) {
    viewer.innerHTML = "<h2>No hay resultados</h2>";
    return;
  }

  let html = "<h2>Resultados</h2>";

  resultados.forEach(r => {
    html += `<div class="link" onclick="abrir('${r}')">${r}</div>`;
  });

  viewer.innerHTML = html;
}

/* =========================
   🕵️ SITIOS .SPY
========================= */

async function cargarSpy(nombre) {
  const snap = await getDocs(collection(db, "sites"));

  let encontrado = false;

  snap.forEach(docu => {
    const d = docu.data();

    if (d.nombre === nombre) {
      viewer.innerHTML = `
        <div class="card" style="background:white;color:black;">
          ${d.contenido}
        </div>

        <textarea id="edit">${d.contenido}</textarea><br><br>

        <button onclick="guardar('${docu.id}')">Guardar</button>
        <button onclick="borrar('${docu.id}')">Eliminar</button>
      `;
      encontrado = true;
    }
  });

  if (!encontrado) {
    viewer.innerHTML = `
      <h2>No existe</h2>
      <button onclick="abrirCrear()">Crear</button>
    `;
  }
}

/* =========================
   ➕ CREAR
========================= */

window.abrirCrear = function() {
  viewer.innerHTML = `
    <h2>Crear sitio</h2>

    <input id="name" placeholder="nombre.spy"><br><br>
    <textarea id="content"></textarea><br><br>
    <input id="pass" placeholder="Contraseña (opcional)"><br><br>

    <button onclick="crear()">Crear</button>
  `;
};

window.crear = async function() {
  const nombre = document.getElementById("name").value;
  let contenido = document.getElementById("content").value;
  const pass = document.getElementById("pass").value;

  if (!nombre.endsWith(".spy")) {
    alert("Debe terminar en .spy");
    return;
  }

  if (pass) {
    contenido = await encriptar(contenido, pass);
  }

  await addDoc(collection(db, "sites"), {
    nombre,
    contenido,
    protegido: !!pass
  });

  alert("Creado");
};

/* =========================
   📂 LISTAR
========================= */

window.listar = async function() {
  const snap = await getDocs(collection(db, "sites"));

  let html = "<h2>Sites</h2>";

  snap.forEach(docu => {
    const d = docu.data();
    html += `<div class="link" onclick="abrir('${d.nombre}')">${d.nombre}</div>`;
  });

  viewer.innerHTML = html;
};

window.abrir = function(nombre) {
  document.getElementById("url").value = nombre;
  cargarSpy(nombre);
};

/* =========================
   ✏️ EDITAR
========================= */

window.guardar = async function(id) {
  const texto = document.getElementById("edit").value;

  await updateDoc(doc(db, "sites", id), {
    contenido: texto
  });

  alert("Guardado");
};

window.borrar = async function(id) {
  await deleteDoc(doc(db, "sites", id));
  alert("Eliminado");
  inicio();
};

/* =========================
   📜 HISTORIAL
========================= */

function guardarHistorial(q) {
  let h = JSON.parse(localStorage.getItem("historial") || "[]");
  h.unshift(q);
  localStorage.setItem("historial", JSON.stringify(h.slice(0, 10)));
}

</script>

</body>
</html>
