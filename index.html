<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    #topbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #020617;
      align-items: center;
    }

    #url {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      font-weight: bold;
    }

    #createBtn {
      position: absolute;
      right: 10px;
      top: 55px;
      background: #3b82f6;
      color: white;
    }

    #home {
      text-align: center;
      padding: 40px;
    }

    #viewer {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      display: none;
      background: white;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div id="topbar">
  <input id="url" placeholder="Search or enter URL or .spy">
  <button onclick="go()">Go</button>
</div>

<button id="createBtn" onclick="openCreate()">Create .spy</button>

<div id="home">
  <div class="logo">SpyX Browser</div>
  <p>Experimental distributed browser system</p>
</div>

<iframe id="viewer"></iframe>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBjUx7G7Llqx6OGLcwRdixqyOBcXtN6f7A",
  authDomain: "spyx-browser.firebaseapp.com",
  projectId: "spyx-browser",
  storageBucket: "spyx-browser.firebasestorage.app",
  messagingSenderId: "496774958625",
  appId: "1:496774958625:web:74284624e8a4c405071d60"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🌐 GATEWAY */
const NODE_PROXY = "https://spyx-browser.onrender.com/proxy?url=";

/* UI CONTROL */
function showBrowser() {
  document.getElementById("home").style.display = "none";
  document.getElementById("viewer").style.display = "block";
}

/* 🚀 NAVIGATION */
window.go = function () {
  let url = document.getElementById("url").value.trim();
  if (!url) return;

  showBrowser();

  /* 🧠 .spy SYSTEM */
  if (url.endsWith(".spy")) {
    loadSpy(url);
    return;
  }

  /* 🌐 NORMAL WEB VIA GATEWAY */
  document.getElementById("viewer").src =
    NODE_PROXY + encodeURIComponent(url);
};

/* 🕵️ LOAD .spy */
async function loadSpy(name) {
  const snap = await getDocs(collection(db, "sites"));

  let found = false;

  snap.forEach(docu => {
    const data = docu.data();

    if (data.nombre === name) {
      let html = atob(data.contenido);

      document.getElementById("viewer").srcdoc = `
        <html>
        <body style="font-family:Arial;padding:20px;">
          ${html}
        </body>
        </html>
      `;

      found = true;
    }
  });

  if (!found) {
    document.getElementById("viewer").srcdoc =
      "<h2>Site not found</h2>";
  }
}

/* ➕ CREATE UI */
window.openCreate = function () {
  showBrowser();

  document.getElementById("viewer").srcdoc = `
    <html>
    <body style="font-family:Arial;background:#0f172a;color:white;padding:20px;">
      <h2>Create .spy site</h2>

      <input id="name" placeholder="name.spy" style="width:100%;padding:10px;"><br><br>
      <textarea id="content" style="width:100%;height:200px;"></textarea><br><br>

      <button onclick="parent.saveSpy()">Save</button>
    </body>
    </html>
  `;
};

/* 💾 SAVE .spy */
window.saveSpy = async function () {
  let doc = document.getElementById("viewer").contentWindow.document;

  let name = doc.getElementById("name").value;
  let content = doc.getElementById("content").value;

  if (!name.endsWith(".spy")) {
    alert("Must end in .spy");
    return;
  }

  await addDoc(collection(db, "sites"), {
    nombre: name,
    contenido: btoa(content)
  });

  alert("Saved .spy site");
};

</script>

</body>
</html>
