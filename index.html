<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SpyX Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.topbar {
  display:flex;
  gap:5px;
  padding:10px;
  background:#020617;
}

input {
  flex:1;
  padding:10px;
  border:none;
  outline:none;
}

button {
  padding:10px;
  background:#22c55e;
  border:none;
  cursor:pointer;
}

#visor {
  padding:20px;
}

textarea {
  width:100%;
  height:150px;
}
</style>
</head>

<body>

<div class="topbar">
  <input id="url" placeholder="Escribe URL o spy://...">
  <button onclick="abrir()">Abrir</button>
  <button onclick="crearSpy()">+ Crear .spy</button>
</div>

<div id="visor">
  <h2>🕵️ SpyX Browser</h2>
  <p>Bienvenido</p>
</div>

<script>

/* 🔓 ABRIR */
function abrir() {
  let url = document.getElementById("url").value;

  if (!url) return;

  // 🌐 SITIO SPY
  if (url.startsWith("spy://")) {
    const id = url.replace("spy://", "");
    const contenido = localStorage.getItem("spy_site_" + id);

    if (!contenido) {
      document.getElementById("visor").innerHTML = "❌ Sitio no encontrado";
      return;
    }

    document.getElementById("visor").innerHTML = contenido;
    return;
  }

  // 🌍 WEB NORMAL
  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  window.open(url, "_blank");
}

/* ➕ CREAR SITIO SPY */
function crearSpy() {
  const nombre = prompt("Nombre del sitio (.spy):");

  if (!nombre) return;

  const contenido = prompt("Contenido HTML del sitio:");

  if (!contenido) return;

  localStorage.setItem("spy_site_" + nombre, contenido);

  alert("✅ Sitio creado:\nspy://" + nombre);
}

</script>

</body>
</html>
