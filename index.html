<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #111;
      color: white;
    }

    #tabs {
      display: flex;
      background: #000;
      padding: 5px;
    }

    .tab {
      padding: 5px 10px;
      background: #222;
      margin-right: 5px;
      cursor: pointer;
      border-radius: 5px;
    }

    .active {
      background: #00aa88;
    }

    #topbar {
      display: flex;
      padding: 10px;
      background: #1a1a1a;
      gap: 5px;
    }

    input {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 5px;
    }

    button {
      padding: 8px;
      border: none;
      border-radius: 5px;
      background: #333;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="tabs"></div>

<div id="topbar">
  <button onclick="volver()">⬅️</button>
  <button onclick="adelante()">➡️</button>
  <button onclick="recargar()">🔄</button>

  <input id="url" placeholder="Buscar o URL">

  <button onclick="ir()">Ir</button>
  <button onclick="nuevaTab()">➕</button>
</div>

<script>

let pestañas = [];
let actual = 0;

/* nueva pestaña */
function nuevaTab() {
  pestañas.push("https://duckduckgo.com");
  actual = pestañas.length - 1;
  renderTabs();
}

/* render tabs */
function renderTabs() {
  const cont = document.getElementById("tabs");
  cont.innerHTML = "";

  pestañas.forEach((url, i) => {
    const tab = document.createElement("div");
    tab.className = "tab " + (i === actual ? "active" : "");
    tab.innerText = "Tab " + (i + 1);

    tab.onclick = () => {
      actual = i;
      renderTabs();
    };

    cont.appendChild(tab);
  });
}

/* IR (CLAVE) */
function ir() {
  let input = document.getElementById("url").value;

  if (!input.startsWith("http")) {
    input = "https://duckduckgo.com/?q=" + encodeURIComponent(input);
  }

  pestañas[actual] = input;

  // 🔥 abrir real (NO iframe)
  window.location.href = input;
}

/* navegación real (limitada en web) */
function volver() {
  history.back();
}

function adelante() {
  history.forward();
}

function recargar() {
  location.reload();
}

/* iniciar */
nuevaTab();

</script>

</body>
</html>
