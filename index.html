<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    #topbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #020617;
      align-items: center;
    }

    #url {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      font-weight: bold;
    }

    #createBtn {
      position: absolute;
      right: 10px;
      top: 55px;
      background: #3b82f6;
      color: white;
    }

    #home {
      text-align: center;
      padding: 40px;
    }

    #viewer {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      display: none;
      background: white;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .status {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div id="topbar">
  <input id="url" placeholder="Search / URL / .spy">

  <button onclick="go()">Go</button>
  <button onclick="openWiki()">Wikipedia</button>
  <button onclick="openDirect()">URL</button>
</div>

<button id="createBtn" onclick="openCreate()">Create .spy</button>

<div id="home">
  <div class="logo">SpyX Browser</div>
  <p>Hybrid proxy browser system</p>
  <div class="status">Ready</div>
</div>

<iframe id="viewer"></iframe>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBjUx7G7Llqx6OGLcwRdixqyOBcXtN6f7A",
  authDomain: "spyx-browser.firebaseapp.com",
  projectId: "spyx-browser",
  storageBucket: "spyx-browser.firebasestorage.app",
  messagingSenderId: "496774958625",
  appId: "1:496774958625:web:74284624e8a4c405071d60"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🌐 GATEWAY */
const NODE_PROXY = "https://spyx-browser.onrender.com/proxy?url=";

/* UI */
function showBrowser() {
  document.getElementById("home").style.display = "none";
  document.getElementById("viewer").style.display = "block";
}

/* 🚀 MAIN NAV */
window.go = function () {
  let input = document.getElementById("url").value.trim();
  if (!input) return;

  showBrowser();

  if (input.endsWith(".spy")) {
    loadSpy(input);
    return;
  }

  if (input.includes(".")) {
    openDirect();
    return;
  }

  openWiki();
};

/* 🌍 OPEN URL VIA PROXY */
window.openDirect = function () {
  let url = document.getElementById("url").value.trim();
  if (!url) return;

  showBrowser();

  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  document.getElementById("viewer").src =
    NODE_PROXY + encodeURIComponent(url);
};

/* 📚 WIKIPEDIA SEARCH */
window.openWiki = function () {
  let q = document.getElementById("url").value.trim();
  if (!q) return;

  showBrowser();

  const url =
    "https://en.wikipedia.org/wiki/Special:Search?search=" +
    encodeURIComponent(q);

  document.getElementById("viewer").src =
    NODE_PROXY + encodeURIComponent(url);
};

/* 🕵️ LOAD .spy */
async function loadSpy(name) {
  const snap = await getDocs(collection(db, "sites"));

  let found = false;

  snap.forEach(d => {
    let data = d.data();

    if (data.nombre === name) {
      let html = atob(data.contenido);

      document.getElementById("viewer").srcdoc = `
        <html>
        <body style="font-family:Arial;padding:20px;">
          ${html}
        </body>
        </html>
      `;

      found = true;
    }
  });

  if (!found) {
    document.getElementById("viewer").srcdoc =
      "<h2>.spy not found</h2>";
  }
}

/* ➕ CREATE */
window.openCreate = function () {
  showBrowser();

  document.getElementById("viewer").srcdoc = `
    <html>
    <body style="font-family:Arial;background:#0f172a;color:white;padding:20px;">
      <h2>Create .spy site</h2>

      <input id="name" placeholder="name.spy" style="width:100%;padding:10px;"><br><br>
      <textarea id="content" style="width:100%;height:200px;"></textarea><br><br>

      <button onclick="parent.saveSpy()">Save</button>
    </body>
    </html>
  `;
};

/* 💾 SAVE */
window.saveSpy = async function () {
  let doc = document.getElementById("viewer").contentWindow.document;

  let name = doc.getElementById("name").value;
  let content = doc.getElementById("content").value;

  if (!name.endsWith(".spy")) {
    alert("Must end in .spy");
    return;
  }

  await addDoc(collection(db, "sites"), {
    nombre: name,
    contenido: btoa(content)
  });

  alert("Saved .spy site");
};

</script>

</body>
</html>
