<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    /* 🔝 TOP BAR */
    #topbar {
      display: flex;
      align-items: center;
      padding: 10px;
      background: #020617;
      gap: 10px;
    }

    #url {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
      font-size: 15px;
    }

    button {
      padding: 10px 15px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      color: black;
      font-weight: bold;
    }

    #createBtn {
      position: absolute;
      right: 10px;
      top: 60px;
      background: #3b82f6;
      color: white;
    }

    /* 🧠 VIEWER */
    #viewer {
      padding: 40px;
      text-align: center;
    }

    .logo {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .searchBox {
      width: 60%;
      padding: 12px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
    }

    .result {
      text-align: left;
      margin-top: 20px;
    }

    .link {
      color: #38bdf8;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      height: 200px;
    }

  </style>
</head>

<body>

<!-- 🔝 BARRA -->
<div id="topbar">
  <input id="url" placeholder="Buscar o escribir (.spy)">
  <button onclick="go()">Buscar</button>
</div>

<button id="createBtn" onclick="abrirCrear()">Create my own .spy site</button>

<!-- 🧠 CONTENIDO -->
<div id="viewer">
  <div class="logo">SpyX Browser</div>

  <input class="searchBox" placeholder="Buscar en SpyX..." 
         onkeydown="if(event.key==='Enter') go()">
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBjUx7G7Llqx6OGLcwRdixqyOBcXtN6f7A",
  authDomain: "spyx-browser.firebaseapp.com",
  projectId: "spyx-browser",
  storageBucket: "spyx-browser.firebasestorage.app",
  messagingSenderId: "496774958625",
  appId: "1:496774958625:web:74284624e8a4c405071d60"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const viewer = document.getElementById("viewer");

/* 🧠 NODOS (3 REALES EN CÓDIGO) */
const nodes = [
  {name: "nodeA", key: "k1"},
  {name: "nodeB", key: "k2"},
  {name: "nodeC", key: "k3"}
];

/* 🔐 CIFRADO EN CAPAS (MEJORADO) */
function encryptLayer(data, key) {
  let result = "";
  for (let i = 0; i < data.length; i++) {
    result += String.fromCharCode(data.charCodeAt(i) ^ key.charCodeAt(0));
  }
  return btoa(result);
}

function decryptLayer(data, key) {
  let decoded = atob(data);
  let result = "";
  for (let i = 0; i < decoded.length; i++) {
    result += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(0));
  }
  return result;
}

/* 🧅 SPY ROUTING */
function spyEncrypt(data) {
  let result = data;
  nodes.forEach(n => {
    result = encryptLayer(result, n.key);
  });
  return result;
}

function spyDecrypt(data) {
  let result = data;
  [...nodes].reverse().forEach(n => {
    result = decryptLayer(result, n.key);
  });
  return result;
}

/* 🔍 BUSCAR */
window.go = function() {
  let url = document.getElementById("url").value.trim();

  if (!url) return;

  if (url.endsWith(".spy")) {
    cargarSpy(url);
    return;
  }

  // 🔐 cifrado simulado antes de buscar
  const encrypted = spyEncrypt(url);
  console.log("🔐 encrypted:", encrypted);

  window.open("https://duckduckgo.com/?q=" + encodeURIComponent(url), "_blank");
};

/* 🕵️ CARGAR .spy */
async function cargarSpy(nombre) {
  const snap = await getDocs(collection(db, "sites"));

  let encontrado = false;

  snap.forEach(docu => {
    const data = docu.data();

    if (data.nombre === nombre) {
      const contenido = spyDecrypt(data.contenido);

      viewer.innerHTML = `
        <div style="background:white;color:black;padding:20px;">
          ${contenido}
        </div>

        <hr>

        <textarea id="edit">${contenido}</textarea><br><br>

        <button onclick="guardar('${docu.id}')">Guardar</button>
        <button onclick="borrar('${docu.id}')">Eliminar</button>
      `;

      encontrado = true;
    }
  });

  if (!encontrado) {
    viewer.innerHTML = `
      <h2>No existe este sitio .spy</h2>
      <button onclick="abrirCrear()">Crear uno</button>
    `;
  }
}

/* ➕ CREAR UI */
window.abrirCrear = function() {
  viewer.innerHTML = `
    <h2>Crear sitio .spy</h2>

    <input id="name" placeholder="nombre.spy"><br><br>
    <textarea id="content"></textarea><br><br>

    <button onclick="crear()">Crear</button>
    <button onclick="listar()">Ver sitios</button>
  `;
};

/* 💾 CREAR */
window.crear = async function() {
  const nombre = document.getElementById("name").value;
  const contenido = document.getElementById("content").value;

  if (!nombre || !contenido) {
    alert("Completa todo");
    return;
  }

  const encrypted = spyEncrypt(contenido);

  await addDoc(collection(db, "sites"), {
    nombre,
    contenido: encrypted
  });

  alert("Sitio creado con cifrado spy 🔐");
};

/* 📂 LISTAR */
window.listar = async function() {
  const snap = await getDocs(collection(db, "sites"));

  let html = "<h2>Sites</h2>";

  snap.forEach(docu => {
    const d = docu.data();
    html += `<p class="link" onclick="abrir('${d.nombre}')">${d.nombre}</p>`;
  });

  viewer.innerHTML = html;
};

window.abrir = function(nombre) {
  document.getElementById("url").value = nombre;
  cargarSpy(nombre);
};

/* ✏️ GUARDAR */
window.guardar = async function(id) {
  const texto = document.getElementById("edit").value;
  const encrypted = spyEncrypt(texto);

  await updateDoc(doc(db, "sites", id), {
    contenido: encrypted
  });

  alert("Guardado cifrado 🔐");
};

/* ❌ BORRAR */
window.borrar = async function(id) {
  await deleteDoc(doc(db, "sites", id));
  alert("Eliminado");
  abrirCrear();
};

</script>

</body>
</html>
