<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    #topbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #020617;
      align-items: center;
    }

    #url {
      flex: 1;
      padding: 12px;
      border-radius: 25px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      font-weight: bold;
    }

    #home {
      text-align: center;
      padding: 40px;
    }

    #viewer {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      display: none;
      background: white;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div id="topbar">
  <input id="url" placeholder="Search / URL / .spy">

  <button onclick="go()">Go</button>
  <button onclick="openWiki()">Wikipedia</button>
  <button onclick="openDirect()">URL</button>
  <button onclick="openManager()">My .spy</button>
  <button onclick="openPublic()">Public</button>
</div>

<div id="home">
  <div class="logo">SpyX Browser</div>
</div>

<iframe id="viewer"></iframe>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 TU FIREBASE REAL (NO CAMBIAR) */
const firebaseConfig = {
  apiKey: "AIzaSyBjUx7G7Llqx6OGLcwRdixqyOBcXtN6f7A",
  authDomain: "spyx-browser.firebaseapp.com",
  projectId: "spyx-browser",
  storageBucket: "spyx-browser.firebasestorage.app",
  messagingSenderId: "496774958625",
  appId: "1:496774958625:web:74284624e8a4c405071d60"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* PROXY */
const NODE_PROXY = "https://spyx-browser.onrender.com/proxy?url=";

/* UI */
function showBrowser() {
  document.getElementById("home").style.display = "none";
  document.getElementById("viewer").style.display = "block";
}

/* 🔥 NAV (FIXED) */
window.go = function () {
  let input = document.getElementById("url").value.trim();
  if (!input) return;

  if (input.endsWith(".spy")) {
    loadSpy(input);
  } else if (input.includes(".")) {
    openDirect();
  } else {
    openWiki();
  }
};

/* ✅ URL */
window.openDirect = function () {
  let url = document.getElementById("url").value.trim();
  if (!url) return;

  showBrowser();

  if (!url.startsWith("http")) {
    url = "https://" + url;
  }

  document.getElementById("viewer").src =
    NODE_PROXY + encodeURIComponent(url);
};

/* ✅ WIKI */
window.openWiki = function () {
  let q = document.getElementById("url").value.trim();
  if (!q) return;

  showBrowser();

  let url =
    "https://en.wikipedia.org/wiki/Special:Search?search=" +
    encodeURIComponent(q);

  document.getElementById("viewer").src =
    NODE_PROXY + encodeURIComponent(url);
};

/* ✅ LOAD .spy */
async function loadSpy(name) {
  showBrowser();

  const snap = await getDocs(collection(db, "sites"));

  let found = false;

  snap.forEach(d => {
    let data = d.data();

    if (data.nombre === name) {
      document.getElementById("viewer").srcdoc = atob(data.contenido);
      found = true;
    }
  });

  if (!found) {
    document.getElementById("viewer").srcdoc = "<h2>.spy not found</h2>";
  }
}

/* ✅ MANAGER */
window.openManager = async function () {
  showBrowser();

  const snap = await getDocs(collection(db, "sites"));

  let html = "<h2>My .spy</h2>";

  snap.forEach(d => {
    let data = d.data();

    html += `
      <p onclick="parent.openSpy('${data.nombre}')">${data.nombre}</p>
      <button onclick="parent.deleteSpy('${d.id}')">Delete</button>
      <hr>
    `;
  });

  document.getElementById("viewer").srcdoc = html;
};

window.openSpy = function(name) {
  document.getElementById("url").value = name;
  loadSpy(name);
};

/* DELETE */
window.deleteSpy = async function(id) {
  await deleteDoc(doc(db, "sites", id));
  openManager();
};

/* ✅ PUBLIC */
window.openPublic = async function () {
  showBrowser();

  const snap = await getDocs(collection(db, "sites"));

  let html = "<h2>Public .spy</h2>";

  snap.forEach(d => {
    let data = d.data();

    if (data.public) {
      html += `
        <p onclick="parent.openSpy('${data.nombre}')">${data.nombre}</p>
        ❤️ ${data.likes || 0}
        <button onclick="parent.likeSpy('${d.id}')">Like</button>
        <hr>
      `;
    }
  });

  document.getElementById("viewer").srcdoc = html;
};

/* ✅ LIKE (FIXED REAL) */
window.likeSpy = async function(id) {
  const ref = doc(db, "sites", id);
  await updateDoc(ref, { likes: increment(1) });
  openPublic();
};

</script>

</body>
</html>
