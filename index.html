<!DOCTYPE html>
<html>
<head>
  <title>SpyX Browser</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }

    /* TOP BAR */
    #topbar {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #020617;
      align-items: center;
    }

    #url {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #22c55e;
      font-weight: bold;
    }

    #createBtn {
      position: absolute;
      right: 10px;
      top: 55px;
      background: #3b82f6;
      color: white;
    }

    #viewer {
      width: 100%;
      height: 85vh;
      border: none;
      background: white;
    }

    #panel {
      display: flex;
      gap: 10px;
      padding: 5px 10px;
      background: #111827;
      font-size: 12px;
      overflow-x: auto;
    }

    .tab {
      background: #1f2937;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    #home {
      text-align: center;
      padding: 30px;
    }

    .small {
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

<!-- TOP BAR -->
<div id="topbar">
  <input id="url" placeholder="Search or URL (.spy supported)">
  <button onclick="go()">Go</button>
</div>

<button id="createBtn" onclick="createSpy()">Create my own .spy site</button>

<!-- TABS -->
<div id="panel"></div>

<!-- HOME -->
<div id="home">
  <h1>SpyX Browser</h1>
  <p class="small">Experimental secure browser system</p>
</div>

<!-- VIEWER -->
<iframe id="viewer"></iframe>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBjUx7G7Llqx6OGLcwRdixqyOBcXtN6f7A",
  authDomain: "spyx-browser.firebaseapp.com",
  projectId: "spyx-browser",
  storageBucket: "spyx-browser.firebasestorage.app",
  messagingSenderId: "496774958625",
  appId: "1:496774958625:web:74284624e8a4c405071d60"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* PROXY */
const PROXY = "https://spyx-browser.onrender.com/proxy?url=";

/* DATA */
let tabs = [];
let history = [];
let favorites = [];

/* SIMPLE ENCODE (NO FALSE SECURITY CLAIMS) */
function encode(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function decode(str) {
  return decodeURIComponent(escape(atob(str)));
}

/* NAVIGATE */
window.go = function() {
  let url = document.getElementById("url").value.trim();
  if (!url) return;

  addHistory(url);

  if (url.endsWith(".spy")) {
    loadSpy(url);
    return;
  }

  load(PROXY + encodeURIComponent(url));
};

/* LOAD NORMAL */
function load(url) {
  document.getElementById("viewer").src = url;
  document.getElementById("home").style.display = "none";
}

/* LOAD SPY */
async function loadSpy(name) {
  const snap = await getDocs(collection(db, "sites"));

  snap.forEach(d => {
    let data = d.data();

    if (data.nombre === name) {
      let content = decode(data.contenido);

      document.getElementById("viewer").srcdoc = `
        <html>
        <body style="font-family:Arial;padding:20px;">
          ${content}
        </body>
        </html>
      `;
    }
  });
}

/* HISTORY */
function addHistory(url) {
  history.push(url);
  if (history.length > 20) history.shift();
}

/* FAVORITES */
function addFav(url) {
  if (!favorites.includes(url)) {
    favorites.push(url);
  }
}

/* CREATE SPY */
window.createSpy = function() {
  let name = prompt("Name:");
  let content = prompt("Content:");

  if (!name || !content) return;

  addDoc(collection(db, "sites"), {
    nombre: name,
    contenido: encode(content)
  });

  alert("Spy site created");
};

/* TABS SYSTEM (SIMULATED) */
function addTab(url) {
  tabs.push(url);

  let tab = document.createElement("div");
  tab.className = "tab";
  tab.innerText = url.slice(0, 20);

  tab.onclick = () => {
    document.getElementById("url").value = url;
    go();
  };

  document.getElementById("panel").appendChild(tab);
}

/* ENTER KEY SUPPORT */
document.getElementById("url").addEventListener("keydown", e => {
  if (e.key === "Enter") go();
});

</script>

</body>
</html>
