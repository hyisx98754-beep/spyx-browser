<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SpyX Browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

.topbar {
  display:flex;
  padding:10px;
  background:#020617;
}

input {
  flex:1;
  padding:10px;
  border:none;
  outline:none;
}

button {
  padding:10px;
  background:#22c55e;
  border:none;
  cursor:pointer;
}

.box {
  margin-top:40px;
}

textarea {
  width:80%;
  height:120px;
}
</style>
</head>

<body>

<div class="topbar">
  <input id="input" placeholder="Escribe mensaje o URL...">
  <button onclick="cifrar()">Cifrar</button>
  <button onclick="descifrar()">Descifrar</button>
</div>

<div class="box">
  <h2>🔐 SpyX Encryption</h2>
  <pre id="resultado"></pre>
</div>

<script>
let claves = [];

/* 🔑 Generar clave */
async function generarClave() {
  return await crypto.subtle.generateKey(
    { name: "AES-GCM", length: 256 },
    true,
    ["encrypt", "decrypt"]
  );
}

/* 🔐 Cifrar */
async function cifrarTexto(texto, clave) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encoded = new TextEncoder().encode(texto);

  const cifrado = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv },
    clave,
    encoded
  );

  return {
    data: Array.from(new Uint8Array(cifrado)),
    iv: Array.from(iv)
  };
}

/* 🔓 Descifrar */
async function descifrarTexto(obj, clave) {
  const data = new Uint8Array(obj.data);
  const iv = new Uint8Array(obj.iv);

  const descifrado = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv },
    clave,
    data
  );

  return new TextDecoder().decode(descifrado);
}

/* 🔐 CIFRADO EN CAPAS */
async function cifrar() {
  let texto = document.getElementById("input").value;
  claves = [];

  for (let i = 0; i < 3; i++) {
    const clave = await generarClave();
    claves.push(clave);

    const resultado = await cifrarTexto(texto, clave);
    texto = JSON.stringify(resultado);
  }

  // 🔥 generar link tipo .spy (simulado)
  const link = "spy://" + btoa(texto);

  document.getElementById("resultado").textContent =
    "🔐 Cifrado en capas:\n\n" + texto +
    "\n\n🌐 Link SpyX:\n" + link;
}

/* 🔓 DESCIFRAR */
async function descifrar() {
  let texto = document.getElementById("input").value;

  try {
    // si es link spy
    if (texto.startsWith("spy://")) {
      texto = atob(texto.replace("spy://", ""));
    }

    let obj = JSON.parse(texto);

    for (let i = claves.length - 1; i >= 0; i--) {
      const desc = await descifrarTexto(obj, claves[i]);

      try {
        obj = JSON.parse(desc);
      } catch {
        obj = desc;
      }
    }

    document.getElementById("resultado").textContent =
      "🔓 Descifrado:\n\n" + obj;

  } catch (e) {
    document.getElementById("resultado").textContent =
      "❌ Error al descifrar";
  }
}
</script>

</body>
</html>
